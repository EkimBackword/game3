version: '3.8'
services:
  backend:
    build: 
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: game3_backend
    ports:
      - '3000:3000'
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: game3_frontend
    ports:
      - '8080:80'