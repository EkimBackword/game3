<div class="flip_card"
    [class.flip_card__open]="isOpen">
    <div class="flip_card_face">
        <div class="flip_card_face flip_card_face__front">
            <div class="clank_face" [ngStyle]="style"></div>
        </div>
        <div class="flip_card_face flip_card_face__back">
            <img class="clank_back" src="/assets/images/cards/card_back.jpg" alt="/assets/images/cards/card_back.jpg">
        </div>
    </div>
</div>
