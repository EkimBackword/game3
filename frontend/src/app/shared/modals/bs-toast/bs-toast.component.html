<div class="toast show bg-{{data.severity}}">
    <div class="toast-header">
        <fa-icon *ngIf="data.icon"
            [style]="data.iconStyle"
            [icon]="data.icon"
        ></fa-icon>
        <strong class="me-auto">{{data.message}}</strong>
        <small class="text-muted" *ngIf="data.submessage">{{data.submessage}}</small>
        <button type="button" class="btn-close" aria-label="Close" (click)="close()"></button>
    </div>
    <div class="toast-body"
        [class.toast-body--wo-text]="data.bodyText == null || data.bodyText.length == 0"
        [style]="data.bodyStyle"
    >{{data.bodyText ?? ''}}</div>
</div>
