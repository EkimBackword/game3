<h1 mat-dialog-title *ngIf="data.title">{{data.title}}</h1>
<div mat-dialog-content>
    <p>{{data.text}}</p>
</div>
<div mat-dialog-actions class="d-flex flex-row justify-content-end">
    <button class="btn btn-primary m-1" [mat-dialog-close]="true">
        {{data.approveText ?? 'Да'}}
    </button>
    <button class="btn btn-danger m-1" [mat-dialog-close]="false" cdkFocusInitial>
        {{data.cancelText ?? 'Нет'}}
    </button>
</div>
