<h1 mat-dialog-title *ngIf="data.title">{{data.title}}</h1>
<div mat-dialog-content>
    <label
        for="value"
        class="form-label"
        *ngIf="data.label">
        {{data.label}}
    </label>
    <input
        type="text"
        class="form-control"
        id="value"
        [formControl]="form.controls.value">
</div>
<div mat-dialog-actions class="d-flex flex-row justify-content-end">
    <button class="btn btn-primary m-1" (click)="apply()">
        {{data.applyText ?? 'Сохранить'}}
    </button>
    <button class="btn btn-danger m-1" (click)="cancel()" cdkFocusInitial>
        {{data.cancelText ?? 'Отменить'}}
    </button>
</div>
