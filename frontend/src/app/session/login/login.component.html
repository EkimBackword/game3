<form [formGroup]="form" class="card login-form">
    <img
        ngSrc="/assets/images/clank.jpg"
        [height]="285"
        [width]="600"
        class="card-img-top"
        alt="clank logo">
    <div class="card-body">
        <div class="row">
            <label for="login" class="col-sm-4 col-form-label">Имя пользователя</label>
            <div class="col-sm-8">
              <input type="text" class="form-control" id="login" placeholder="MyNikname_123" formControlName="login">
            </div>
        </div>
    </div>
    <div class="card-footer text-muted">
        <div class="row">
            <button type="button" class="btn btn-primary" (click)="login()">Войти</button>
        </div>
    </div>
</form>
