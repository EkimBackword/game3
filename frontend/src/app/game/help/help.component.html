<div class="container container--page shadow d-flex flex-row flex-wrap justify-content-start align-items-start">
    <div class="col-6 mb-3 d-flex flex-row justify-content-start align-items-start" *ngFor="let card of cards">
        <div class="flip_card">
            <div class="flip_card_face">
                <div class="flip_card_face flip_card_face__front">
                    <div class="clank_face" [ngStyle]="card.style"></div>
                </div>
                <div class="flip_card_face flip_card_face__back">
                    <img class="clank_back" src="/assets/images/cards/card_back.jpg" alt="/assets/images/cards/card_back.jpg">
                </div>
            </div>
        </div>
        <div class="card_info p-1 d-flex flex-column justify-content-start align-items-stretch">
            <p><strong>Имя:</strong> {{card.config.name}}</p>
            <ng-container *ngIf="card.config.acquire">
                <p><strong>Покупка:</strong></p>
                <ul *ngFor="let acquire of card.config.acquire?.list">
                    <li *ngIf="acquire.cost">
                        <p><strong>Цена:</strong></p>
                        <p *ngFor="let item of acquire.cost | keyvalue">
                            <strong>{{item.key}}:</strong> {{item.value}}
                        </p>
                    </li>
                    <li *ngIf="acquire.benefit">
                        <p><strong>Выгода:</strong></p>
                        <p *ngFor="let item of acquire.benefit | keyvalue">
                            <strong>{{item.key}}:</strong> {{item.value}}
                        </p>
                    </li>
                </ul>
            </ng-container>
            <ng-container *ngIf="card.config.benefit">
                <p><strong>Выгода:</strong></p>
                <ul>
                    <li *ngFor="let item of card.config.benefit | keyvalue"><strong>{{item.key}}:</strong> {{item.value}}</li>
                </ul>
            </ng-container>
        </div>
    </div>
</div>
