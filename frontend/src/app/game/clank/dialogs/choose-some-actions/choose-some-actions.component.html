<h1 mat-dialog-title>
    Выберите события ({{count}} шт.)
</h1>
<div mat-dialog-content>
    <mat-list>
        <ng-container *ngFor="let item of list; let last = last">
            <mat-list-item>
                <mat-slide-toggle
                    [(ngModel)]="item.checked"
                    (ngModelChange)="onSelect()"
                    [disabled]="!item.checked && !canSelect"
                >
                    <div class="d-flex flex-column">
                        <div class="d-flex flex-row" mat-line *ngIf="item.action.costDescription != null || item.action.cost != null">
                            {{item.action.costDescription ?? 'Заплатить'}}
                            <app-clank-cost-info
                                *ngIf="item.action.cost != null"
                                [data]="item.action.cost"
                            ></app-clank-cost-info>
                        </div>
                        <div class="d-flex flex-row" mat-line *ngIf="item.action.benefitDescription != null || item.action.benefit != null">
                            {{item.action.benefitDescription ?? 'Получить'}}
                            <app-clank-cost-info
                                *ngIf="item.action.benefit != null"
                                [data]="item.action.benefit"
                            ></app-clank-cost-info>
                        </div>
                    </div>
                </mat-slide-toggle>
            </mat-list-item>
            <mat-divider *ngIf="!last"></mat-divider>
        </ng-container>
    </mat-list>
</div>
<div mat-dialog-actions class="d-flex flex-row justify-content-end">
    <button class="btn btn-primary m-1"
        type="submit"
        (click)="submit()">
        Использовать
    </button>
    <button class="btn btn-danger m-1"
        type="submit"
        (click)="cancel()">
        Отменить
    </button>
</div>
