<h1 mat-dialog-title>
    {{data.title}} <span *ngIf="totalCount > 0">({{selectedCount}} / {{totalCount}} шт.)</span>
</h1>
<div mat-dialog-content>
    <div class="card-list">
        <ng-container *ngFor="let item of list">
            <app-clank-card
                class="card"
                [class.card--selected]="item.value"
                [class.card--notselectable]="!item.value && selectedCount >= totalCount"
                [width]="cardsWrapInfo.cardWidth"
                [height]="cardsWrapInfo.cardHeight"
                [data]="item.data"
            ></app-clank-card>
        </ng-container>
    </div>
</div>
<div mat-dialog-actions class="d-flex flex-row justify-content-end">
    <button class="btn btn-primary m-1"
        type="submit"
        (click)="close()"
        *ngIf="totalCount > 0 || data.showActionButton"
        [disabled]="selectedCount < totalCount">
        {{data.actionText ?? 'Сохранить'}}
    </button>
    <button class="btn btn-primary m-1"
        type="submit"
        (click)="cancel()">
        {{data.cancelText ?? 'Закрыть'}}
    </button>
</div>
