<div class="position-relative clank-cost-info">
    <app-clank-cost-info
        [data]="data.player.benefitInfo"
    ></app-clank-cost-info>
</div>
<div class="position-relative">
    <app-clank-card class="position-absolute"
        *ngFor="let cardInfo of (cardsSubject | async); trackBy: trackById"
        [width]="cardsWrapInfo.cardWidth"
        [height]="cardsWrapInfo.cardHeight"
        [data]="cardInfo"
        [ngClass]="cardInfo.classes"
        [ngStyle]="cardInfo.style"
    ></app-clank-card>
</div>
