<ng-container *ngIf="{
    players: onPlayersChangeSubject | async,
    groups: onMarketTokensChangeSubject | async,
    cards: cardsSubject | async
} as asyncData">
    <ng-container *ngIf="currentPlayer">
        <label>Очки доступные для покупки карт или жетонов:</label>
        <strong>{{currentPlayer.name}}</strong>
        <div class="position-relative clank-cost-info">
            <app-clank-cost-info
                [data]="currentPlayer.benefitInfo"
                [type]="ClankCostInfoType.marketInfo"
                [elementHeight]="cardsWrapInfo.clankCostInfoHeight * 2"
            ></app-clank-cost-info>
        </div>
    </ng-container>
    <label>Жетоны можно купить за 7 монет (только находясь в магазине):</label>
    <div class="position-relative clank-tokens" *ngIf="asyncData.groups">
        <div class="position-relative clank-tokens-group" *ngFor="let tokens of asyncData.groups"
            [class.clank-tokens-group--disable]="!playerPosition?.isMarket || currentPlayer?.id != activePlayer?.id">
            <div class="position-absolute clank-token" *ngFor="let token of tokens">
                <app-clank-token
                    [size]="cardsWrapInfo.dungeonTokenSize"
                    [token]="token"
                    [isOpen]="true"
                    (click)="useToken(token)"
                ></app-clank-token>
            </div>
        </div>
    </div>
    <label>Карты доступные для покупки:</label>
    <div class="position-relative">
        <app-clank-card class="position-absolute"
            *ngFor="let cardInfo of asyncData.cards; trackBy: trackById"
            [@inOutAnimation]
            [width]="cardsWrapInfo.cardWidth"
            [height]="cardsWrapInfo.cardHeight"
            [data]="cardInfo"
            [ngClass]="cardInfo.classes"
            [ngStyle]="cardInfo.style"
        ></app-clank-card>
    </div>
</ng-container>
