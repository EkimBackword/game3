
<ng-container *ngIf="{
    status: statusSubject | async,
    name: nameSubject | async,
    map: onMapChangeSubject | async,
    players: playersSubject | async,
    activePlayer: (activePlayerSubject | async),
    logGroups: onActionLogs | async
} as asyncData">
    <div class="header p-1" *ngIf="asyncData.name">
        <div class="d-flex flex-row justify-content-between">
            <label class="game-label">Название игры:</label>
            <fa-icon
                class="pointer"
                [style.width.px]="20"
                [icon]="soundService.soundState.icon"
                (click)="soundService.changeSoundState()"
            ></fa-icon>
        </div>
        <h6 class="text-ellipsis" [title]="asyncData.name">{{asyncData.name}}</h6>
    </div>
    <div class="body p-1">
        <div class="players_list">
            <label class="game-label">Список игроков:</label>
            <div class="card w-100 mb-2"
                [class.current_player]="currentPlayer?.id === player.id"
                *ngFor="let player of asyncData.players; trackBy: trackById; let i = index">
                <div class="card-header">
                    <div class="d-flex justify-content-between align-items-center">
                        <h6 class="m-0 text-ellipsis">{{player.name}}</h6>
                        <mat-icon class="flex-shrink-0" [color]="player.isOnline ? 'primary' : 'warn'">{{player.isOnline ? 'wifi' : 'wifi_off'}}</mat-icon>
                    </div>
                </div>
                <div class="card-body">
                    <div class="clank-cost-info">
                        <app-clank-cost-info
                            [data]="player.benefitInfo"
                            [type]="ClankCostInfoType.gameInfo"
                            [elementHeight]="40"
                        ></app-clank-cost-info>
                    </div>
                    <div class="clank-artifacts">
                        <div class="clank-artifact" *ngFor="let artifact of player.artifacts; trackBy: trackById">
                            <app-clank-artifact
                                [data]="artifact"
                                [height]="50"
                            ></app-clank-artifact>
                        </div>
                    </div>
                    <div class="clank-artifacts">
                        <ng-container *ngFor="let token of player.tokens; trackBy: trackById">
                            <div class="clank-artifact" *ngIf="!token.isUsable">
                                <app-clank-token
                                    [isOpen]="true"
                                    [token]="token"
                                    [size]="50"
                                ></app-clank-token>
                            </div>
                        </ng-container>
                    </div>
                </div>
                <div class="card-footer">
                    <ng-container *ngIf="asyncData.activePlayer">
                        <ng-container *ngIf="isStarted">
                            <div class="d-flex justify-content-between align-items-center"
                                *ngIf="player.id === asyncData.activePlayer.id">
                                <h6 class="m-0">Ход игрока</h6>
                                <app-clank-meeple
                                    [player]="player"
                                    [size]="20"
                                    (click)="searchPlayer(player.id)"
                                    ngbTooltip="Найти игрока"
                                    placement="left"
                                    container="body"
                                    class="pointer"
                                ></app-clank-meeple>
                            </div>
                            <mat-progress-bar *ngIf="player.id === asyncData.activePlayer.id" mode="buffer"></mat-progress-bar>
                            <div class="d-flex justify-content-between align-items-center"
                                *ngIf="player.id !== asyncData.activePlayer.id">
                                <h6 class="m-0">Ожидание хода</h6>
                                <app-clank-meeple
                                    [player]="player"
                                    [size]="20"
                                    (click)="searchPlayer(player.id)"
                                    ngbTooltip="Найти игрока"
                                    placement="left"
                                    container="body"
                                    class="pointer"
                                ></app-clank-meeple>
                            </div>
                        </ng-container>
                    </ng-container>
                    <ng-container *ngIf="!isStarted && !isFinished && currentPlayer != null">
                        <div class="d-flex justify-content-between align-items-center">
                            <app-clank-meeple [player]="player" [size]="20"></app-clank-meeple>
                            <select class="form-select form-select-sm w-75"
                                [ngModel]="player.colorId"
                                (ngModelChange)="changeColor(player, $event)"
                                [disabled]="currentPlayer.id != player.id"
                            >
                                <ng-container *ngFor="let colorId of GamePlayerColorIds">
                                    <option
                                        *ngIf="GamePlayerColorList[colorId].forPlayer"
                                        [value]="colorId"
                                    >{{GamePlayerColorList[colorId].name}}</option>
                                </ng-container>
                            </select>
                        </div>

                        <div class="d-flex justify-content-between align-items-center"
                            *ngIf="currentPlayer.id != player.id && currentPlayer.isAdmin">
                            <button class="btn btn-sm btn-secondary"
                                (click)="kickUser(player.id)">
                                Выкинуть игрока
                            </button>
                        </div>
                        <div class="d-flex justify-content-between align-items-center"
                            *ngIf="currentPlayer.id == player.id && currentPlayer.isAdmin">
                            <select class="form-select form-select-sm"
                                aria-label="Choose map"
                                id="selectedMapId"
                                [(ngModel)]="selectedMapId"
                                (ngModelChange)="selectedMapChanged($event)">
                                <option *ngFor="let map of maps" [value]="map.id">{{map.name}}</option>
                            </select>
                        </div>
                    </ng-container>
                </div>
            </div>
        </div>
    </div>
    <div class="footer">
        <div class="game_action_logs">
            <div class="game_action_logs_title p-1"
                (click)="openLogsList(asyncData.logGroups)"
                ngbTooltip="Открыть журнал"
                placement="top"
                container="body"
            >
                <div class="game_action_logs__group_name">Журнал событий</div>
                <fa-icon
                    class="pointer"
                    [style.width.px]="20"
                    [icon]="icons.logs"
                ></fa-icon>
            </div>
            <ng-container *ngFor="let group of asyncData.logGroups | slice:0:1 + (asyncData.players?.length ?? 0)">
                <div class="game_action_logs__group p-1">
                    <div class="game_action_logs__group_name">{{group.name}}</div>
                    <ngb-alert
                        *ngFor="let log of group.list"
                        [dismissible]="false"
                        type="custom"
                        class="alert-custom--{{log.data.colorId}}">
                        {{log.data.text}}
                        <div class="alert-subtext" *ngIf="log.data.subtext">{{log.data.subtext}}</div>
                    </ngb-alert>
                </div>
            </ng-container>
        </div>
        <div class="game_action_buttons p-1">
            <button class="btn btn-sm btn-primary mb-1"
                [class.not-allowed]="!validColorList"
                (click)="startGame()"
                *ngIf="currentPlayer?.isAdmin && !isStarted && !isFinished"
                [matTooltip]="invalidColorText"
                matTooltipPosition="left"
                [matTooltipDisabled]="validColorList">
                Начать игру
            </button>
            <button class="btn btn-sm btn-primary mb-1"
                (click)="finishGame()"
                *ngIf="currentPlayer?.isAdmin && isStarted && !isFinished">
                Закончить игру
            </button>
            <button class="btn btn-sm btn-secondary"
                (click)="exitGame()">
                Выйти из игры
            </button>
        </div>
    </div>
</ng-container>
