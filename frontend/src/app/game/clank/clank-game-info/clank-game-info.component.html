
<ng-container *ngIf="(statusSubject | async) as gameName">
    <div class="header p-1" *ngIf="(nameSubject | async) as gameName">
        <h6>Название игры:</h6>
        <h5 class="text-ellipsis" [title]="gameName">{{gameName}}</h5>
    </div>
    <div class="body p-1">
        <div class="players_list">
            <h6>Список игроков:</h6>
            <div class="card w-100 mb-2" *ngFor="let player of (playersSubject | async); trackBy: trackById; let i = index">
                <div class="card-header">
                    <div class="d-flex justify-content-between align-items-center">
                        <h6 class="m-0">{{player.name}}</h6>
                        <mat-icon [color]="player.isOnline ? 'primary' : 'warn'">{{player.isOnline ? 'wifi' : 'wifi_off'}}</mat-icon>
                    </div>
                </div>
                <div class="card-body">
                    <div class="clank-cost-info">
                        <app-clank-cost-info
                            [data]="player.benefitInfo"
                            [type]="ClankCostInfoType.gameInfo"
                        ></app-clank-cost-info>
                    </div>
                    <div class="clank-artifacts">
                        <div class="clank-artifact" *ngFor="let artifact of player.artifacts; trackBy: trackById">
                            <app-clank-artifact
                                [data]="artifact"
                                [height]="50"
                            ></app-clank-artifact>
                        </div>
                    </div>
                    <div class="clank-artifacts">
                        <div class="clank-artifact" *ngFor="let token of player.tokens; trackBy: trackById">
                            <app-clank-token
                                [isOpen]="true"
                                [state]="token"
                                [size]="50"
                            ></app-clank-token>
                        </div>
                    </div>
                </div>
                <div class="card-footer">
                    <ng-container *ngIf="(activePlayerSubject | async) as activePlayer">
                        <ng-container *ngIf="isStarted">
                            <div class="d-flex justify-content-between align-items-center"
                                *ngIf="player.id === activePlayer.id">
                                <h6 class="m-0">Ход игрока</h6>
                                <app-clank-meeple [player]="player" [size]="20"></app-clank-meeple>
                            </div>
                            <mat-progress-bar *ngIf="player.id === activePlayer.id" mode="buffer"></mat-progress-bar>
                            <div class="d-flex justify-content-between align-items-center"
                                *ngIf="player.id !== activePlayer.id">
                                <h6 class="m-0">Ожидание хода</h6>
                                <app-clank-meeple [player]="player" [size]="20"></app-clank-meeple>
                            </div>
                        </ng-container>
                    </ng-container>
                    <ng-container *ngIf="!isStarted && !isFinished && currentPlayer != null">
                        <div class="d-flex justify-content-between align-items-center">
                            <app-clank-meeple [player]="player" [size]="20"></app-clank-meeple>
                            <select class="form-select form-select-sm w-75"
                                [ngModel]="player.colorId"
                                (ngModelChange)="changeColor(player, $event)"
                                [disabled]="currentPlayer.id != player.id"
                            >
                                <ng-container *ngFor="let colorId of GamePlayerColorIds">
                                    <option
                                        *ngIf="GamePlayerColorList[colorId].forPlayer"
                                        [value]="colorId"
                                    >{{GamePlayerColorList[colorId].name}}</option>
                                </ng-container>
                            </select>
                        </div>

                        <div class="d-flex justify-content-between align-items-center"
                            *ngIf="currentPlayer.id != player.id && currentPlayer.isAdmin">
                            <button class="btn btn-sm btn-secondary"
                                (click)="exitGame()">
                                Выкинуть игрока
                            </button>
                        </div>
                    </ng-container>
                </div>
            </div>
        </div>
    </div>
    <div class="footer p-1">
        <div class="game_action_logs">
            <ng-container *ngFor="let group of (onActionLogs | async)">
                <div class="game_action_logs__group">
                    <div class="game_action_logs__group_name">{{group.name}}</div>
                    <ngb-alert
                        *ngFor="let log of group.list"
                        [dismissible]="false"
                        type="custom"
                        class="alert-custom--{{log.data.colorId}}">
                        {{log.data.text}}
                    </ngb-alert>
                </div>
            </ng-container>

        </div>
        <button class="btn btn-primary mb-1"
            [class.not-allowed]="!validColorList"
            (click)="startGame()"
            *ngIf="currentPlayer?.isAdmin && !isStarted && !isFinished"
            [matTooltip]="invalidColorText"
            matTooltipPosition="left"
            [matTooltipDisabled]="validColorList">
            Начать игру
        </button>
        <button class="btn btn-sm btn-primary mb-1"
            (click)="finishGame()"
            *ngIf="currentPlayer?.isAdmin && isStarted && !isFinished">
            Закончить игру
        </button>
        <button class="btn btn-sm btn-secondary"
            (click)="exitGame()">
            Выйти из игры
        </button>
    </div>
</ng-container>
