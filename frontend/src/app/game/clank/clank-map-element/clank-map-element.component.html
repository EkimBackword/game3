<ng-container *ngIf="dataSubject | async">
    <ng-container *ngIf="mapElement != null">
        <div class="actions_layer"
            [class.crystal_cave]="mapElement.isCrystalCave">
            <div class="action_move"
                *ngIf="link"
                (click)="onMove()">
                <app-clank-cost-info
                    class="action_move__cost"
                    [data]="link.cost"
                ></app-clank-cost-info>
            </div>
        </div>
    </ng-container>
</ng-container>
