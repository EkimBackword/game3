<ng-container *ngIf="dataSubject | async">
    <ng-container *ngIf="mapElement != null">
        <div class="player_layer">
            <app-clank-meeple
                *ngFor="let player of (playersSubject | async); trackBy: trackById;"
                [player]="player"
            ></app-clank-meeple>
        </div>
        <div class="actions_layer">
            <button type="button"
                class="btn btn-primary"
                *ngIf="link"
                (click)="onMove()">
                <app-clank-cost-info
                    [data]="link.cost"
                ></app-clank-cost-info>
            </button>
        </div>
    </ng-container>
</ng-container>
