<ng-container *ngIf="{
    data: dataSubject | async,
    artifacts: onArtifactsChangeSubject | async,
    tokens: onTokensChangeSubject | async,
    takenToken: onTakeTokenSubject | async
} as asyncData">
    <ng-container *ngIf="mapElement(); let mapElement">
        <div class="actions_layer"
            [class.crystal_cave]="mapElement.isCrystalCave">
            <ng-container *ngIf="asyncData.artifacts && artifact">
                <div class="clank-artifact"
                    (click)="takeArtifact(artifact)"
                    *ngIf="asyncData.artifacts.length > 0 && artifact"
                    [@inOutAnimation]>
                    <app-clank-artifact
                        [data]="artifact"
                    ></app-clank-artifact>
                </div>
            </ng-container>
            <ng-container *ngIf="asyncData.tokens">
                <div class="clank-artifact" *ngIf="asyncData.tokens.length > 0 && visibleTokens.length > 0">
                    <app-clank-token
                        *ngFor="let token of visibleTokens"
                        [token]="token"
                    ></app-clank-token>
                </div>
            </ng-container>
            <ng-container *ngIf="asyncData.takenToken">
                <div class="clank-artifact" *ngIf="asyncData.takenToken != null">
                    <app-clank-token
                        [class.used-token]="asyncData.takenToken.isUsable && asyncData.takenToken.isImmediatelyBenefit"
                        [class.taken-token-usable]="asyncData.takenToken.isUsable && !asyncData.takenToken.isImmediatelyBenefit"
                        [class.taken-token-nousable]="!asyncData.takenToken.isUsable"
                        [token]="asyncData.takenToken"
                        [isOpen]="true"
                    ></app-clank-token>
                </div>
            </ng-container>
            <div class="action_move"
                *ngIf="link"
                (click)="onMove(link)">
                <app-clank-cost-info
                    class="action_move__cost"
                    [data]="link.cost"
                    [direction]="ClankCostInfoDirection.column"
                    [elementHeight]="100"
                ></app-clank-cost-info>
            </div>
        </div>
        <div class="element-map-id" *ngIf="isMapElementIdShow">
            {{mapElement.id}}
        </div>
    </ng-container>
</ng-container>
