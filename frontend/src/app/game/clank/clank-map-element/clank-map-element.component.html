<ng-container *ngIf="dataSubject | async">
    <ng-container *ngIf="mapElement != null">
        <div class="actions_layer"
            [class.crystal_cave]="mapElement.isCrystalCave">
            <ng-container *ngFor="let artifact of (onArtifactsChangeSubject | async); trackBy: trackById">
                <div class="clank-artifact" (click)="takeArtifact(artifact)" *ngIf="mapElement.items?.artefact?.value === artifact.value">
                    <app-clank-artifact
                        [data]="artifact"
                    ></app-clank-artifact>
                </div>
            </ng-container>
            <ng-container *ngIf="(onTokensChangeSubject | async) as tokens">
                <div class="clank-artifact" *ngIf="tokens.length > 0 && visibleTokens.length > 0">
                    <app-clank-token
                        *ngFor="let token of visibleTokens"
                        [token]="token"
                    ></app-clank-token>
                </div>
            </ng-container>
            <ng-container *ngIf="(onTakeTokenSubject | async) as takenToken">
                <div class="clank-artifact" *ngIf="takenToken != null">
                    <app-clank-token
                        [class.used-token]="takenToken.isUsable && takenToken.isImmediatelyBenefit"
                        [class.taken-token-usable]="takenToken.isUsable && !takenToken.isImmediatelyBenefit"
                        [class.taken-token-nousable]="!takenToken.isUsable"
                        [token]="takenToken"
                        [isOpen]="true"
                    ></app-clank-token>
                </div>
            </ng-container>
            <div class="action_move"
                *ngIf="link"
                (click)="onMove(link)">
                <app-clank-cost-info
                    class="action_move__cost"
                    [data]="link.cost"
                    [direction]="ClankCostInfoDirection.column"
                    [elementHeight]="100"
                ></app-clank-cost-info>
            </div>
        </div>
        <div class="element-map-id" *ngIf="isMapElementIdShow">
            {{mapElement.id}}
        </div>
    </ng-container>
</ng-container>
