<app-clank-player-info class="clank_player_info shadow-lg"></app-clank-player-info>
<app-clank-map class="clank_map_info"></app-clank-map>
<app-clank-game-info class="clank_game_info shadow-lg"></app-clank-game-info>
<ng-container *ngIf="{
    status: statusSubject | async,
    result: playersSubject | async
} as asyncData">
    <div class="clank_map_finish_info" *ngIf="asyncData.status === GameInfoStatusIdEnum.Finished">
        <div class="clank_map_finish_info_block shadow">
            <h3 class="message p-2">
                Игра закончена
            </h3>
            <ng-container *ngIf="asyncData.result">
                <table class="w-100 clank_table">
                    <thead>
                        <tr>
                            <th>
                                <div>Игрок</div>
                            </th>
                            <th>
                                <img class="clank_table_head_img"
                                    ngSrc="/assets/images/coins/coins.png"
                                    [height]="50"
                                    [width]="50"

                                    alt="Монеты"
                                    matTooltip="Монеты"
                                    matTooltipPosition="above">
                            </th>
                            <th>
                                <img class="clank_table_head_img"
                                    ngSrc="/assets/images/tokens/tokens.png"
                                    [height]="50"
                                    [width]="50"
                                    alt="Жетоны"
                                    matTooltip="Жетоны"
                                    matTooltipPosition="above">
                            </th>
                            <th>
                                <img class="clank_table_head_img"
                                    ngSrc="/assets/images/artefact.png"
                                    [height]="50"
                                    [width]="50"
                                    alt="Артефакты"
                                    matTooltip="Артефакты"
                                    matTooltipPosition="above">
                            </th>
                            <th>
                                <img class="clank_table_head_img"
                                    ngSrc="/assets/images/cards/card_point.png"
                                    [height]="50"
                                    [width]="50"
                                    alt="Карты"
                                    matTooltip="Карты"
                                    matTooltipPosition="above">
                            </th>
                            <th>
                                <img class="clank_table_head_img"
                                    ngSrc="/assets/images/tokens/bonus/master.png"
                                    [height]="50"
                                    [width]="50"
                                    alt="Жетон мастерства"
                                    matTooltip="Жетон мастерства"
                                    matTooltipPosition="above">
                            </th>
                            <th>
                                <div>Итог</div>
                            </th>
                            <th>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let player of asyncData.result.rows"
                            class="player_row"
                            (click)="openPlayerRowDetail(player)">
                            <td class="player_name_cell">
                                <div class="player_name_cell_element">
                                    <img class="clank_aria_player_img"
                                        [ngSrc]="player.colorInfo.url"
                                        [height]="25"
                                        [width]="25"
                                        [alt]="player.config.colorId">
                                    <div class="text-ellipsis">{{player.name}}</div>
                                </div>
                            </td>
                            <td class="to_right">{{player.coins}}</td>
                            <td class="to_right">{{player.tokens.points}}</td>
                            <td class="to_right">{{player.artifacts.points}}</td>
                            <td class="to_right">{{player.cards.points}}</td>
                            <td class="to_right">{{player.master}}</td>
                            <td class="to_right total">{{player.total}}</td>
                            <td class="to_right total">
                                <button class="btn btn-sm btn-primary" title="Открыть детальную информацтию">
                                    <fa-icon [icon]="icons.link"></fa-icon>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <td class="to_right total" colspan="1">
                                Выиграл:
                            </td>
                            <td class="total" colspan="6">
                                <div class="winner_name"
                                    [style.color]="asyncData.result.winner?.colorInfo?.color">
                                    {{asyncData.result.winner?.name}}
                                </div>
                            </td>
                        </tr>
                    </tfoot>
                </table>
            </ng-container>
            <div class="w-100 d-flex flex-row justify-content-end align-items-center">
                <button class="btn btn-primary"
                    (click)="resetGame()">
                    Начать с начала
                </button>
                <button class="btn btn-danger"
                    (click)="exitGame()">
                    Выйти из игры
                </button>
            </div>
        </div>
    </div>
</ng-container>
