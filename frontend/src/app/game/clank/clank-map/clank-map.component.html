<ng-container *ngIf="{
    mapInfo: mapSubject | async,
    players: playersSubject | async,
    playersPosition: playersPositionSubject | async,
    dragonPosition: dragonPositionSubject | async
} as asyncData">
    <div class="clank_map_container"
        *ngIf="mapInfo != null"
        #clankMapContainer
    >
        <div class="clank_map_layer"
            [style.width.px]="mapInfo.width"
            [style.height.px]="mapInfo.height"
            [style.background-image]="backgroundImage"
        ></div>
        <div class="clank_map_players">
            <app-clank-meeple
                class="clank_map_player"
                [class.clank_map_player__active]="item.isActive"
                *ngFor="let item of asyncData.playersPosition; trackBy: trackById;"
                [player]="item.player"
                [ngStyle]="item.style"
                [size]="item.size"
            ></app-clank-meeple>
            <ng-container *ngIf="asyncData.dragonPosition">
                <div class="clank_map_clank_aria position-absolute"
                    [ngStyle]="asyncData.dragonPosition.clankAriaStyle">
                    <div class="clank_aria_table w-100">
                        <div class="clank_aria_header">
                            <div class="clank_aria_row">
                                <div class="clank_aria_player">Игрок</div>
                                <div class="clank_aria_value">Бдзынь</div>
                            </div>
                        </div>
                        <div class="clank_aria_body">
                            <div class="clank_aria_row"
                                *ngFor="let player of asyncData.players">
                                <div class="clank_aria_player">
                                    <img class="clank_aria_player_img"
                                        [ngSrc]="GamePlayerColorList[player.colorId].url"
                                        [height]="50"
                                        [width]="50"
                                        [alt]="player.colorId">
                                    <div class="clank_aria_player_name text-ellipsis">
                                        {{player.name}}
                                    </div>
                                </div>
                                <div class="clank_aria_value">
                                    {{asyncData.dragonPosition.dragonInfo.clankAria[player.colorId]}}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="clank_map_dragon position-absolute"
                    [ngStyle]="asyncData.dragonPosition.style"
                    [matTooltip]="asyncData.dragonPosition.tooltip"
                    matTooltipPosition="left">
                </div>
            </ng-container>

        </div>
        <div class="clank_map_elements">
            <app-clank-map-element
                *ngFor="let mapElement of mapInfo.elements"
                [mapElement]="mapElement"
            ></app-clank-map-element>
        </div>
    </div>
</ng-container>
