<ng-container *ngIf="mapSubject | async">
    <div class="clank_map_container"
        *ngIf="mapInfo != null"
        #clankMapContainer
    >
        <div class="clank_map_layer"
            [style.width.px]="mapInfo.width"
            [style.height.px]="mapInfo.height"
            [style.background-image]="backgroundImage"
        ></div>
        <div class="clank_map_players">
            <app-clank-meeple
                class="clank_map_player"
                [class.clank_map_player__active]="item.isActive"
                *ngFor="let item of (playersPosition | async); trackBy: trackById;"
                [player]="item.player"
                [ngStyle]="item.style"
                [size]="item.size"
            ></app-clank-meeple>
            <div *ngIf="(dragonPosition | async) as dragon"
                class="clank_map_dragon position-absolute"
                [ngStyle]="dragon.style"
                [matTooltip]="dragon.tooltip"
                matTooltipPosition="left">
                <h1 class="position-absolute top-0 start-50 translate-middle badge rounded-pill bg-danger">
                    {{dragon.dragonInfo.rage}}
                </h1>
            </div>
        </div>
        <div class="clank_map_elements">
            <app-clank-map-element
                *ngFor="let mapElement of mapInfo.elements"
                [mapElement]="mapElement"
            ></app-clank-map-element>
        </div>
    </div>
</ng-container>
