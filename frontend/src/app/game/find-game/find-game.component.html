<div class="container h-100 d-flex flex-column justify-content-center align-items-cente">
    <div class="card game_menu shadow">
        <div class="card-header">
            <h1>Список игр</h1>
        </div>
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 card-body">

            <!-- Name Column -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef> Название игры </th>
                <td mat-cell *matCellDef="let element">
                    <a  class="game_menu_item"
                        [routerLink]="'/' + clankUrl + '/' + element.id"
                        routerLinkActive="active"
                        ariaCurrentWhenActive="page">
                        <fa-icon [icon]="linkIcon"></fa-icon>
                        <span class="game_menu_item_text">{{element.name}}</span>
                    </a>
                </td>
            </ng-container>

            <!-- Status Column -->
            <ng-container matColumnDef="statusId">
                <th mat-header-cell *matHeaderCellDef> Статус игры </th>
                <td mat-cell *matCellDef="let element"> {{GameInfoStatus[element.statusId].name}} </td>
            </ng-container>

            <!-- Map Column -->
            <ng-container matColumnDef="mapId">
                <th mat-header-cell *matHeaderCellDef> Название карты </th>
                <td mat-cell *matCellDef="let element"> {{mapsService.getMapById(element.mapId)?.name}} </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <div class="card-footer">
            <a class="btn btn-link" routerLink="..">Вернуться в меню</a>
        </div>
    </div>

</div>
