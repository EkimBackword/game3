<div class="col-sm-6 wrapper" *ngIf="client.game.setupData(); let _setupData">
    <div class="card">
        <div class="card-header">
            Настройки
        </div>
        <div class="card-body">
            <div class="mb-2 row">
                <label for="masterPlayerId" class="form-label col-sm-3">Условие окончания:</label>
                <div class="col-sm-9">
                    <select class="form-select form-select-sm col-sm-12"
                        aria-label="Choose master player"
                        id="masterPlayerId"
                        [ngModel]="_setupData.mapId"
                        (ngModelChange)="changeSetupData('mapId', $event)">
                        <option
                            *ngFor="let id of mapIds;"
                            [value]="id">
                            {{mapTaxanomy[id].name}}
                        </option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="col-sm-6 wrapper">
    <div class="card">
        <div class="card-header">Список игроков</div>
        <ul class="list-group list-group-flush">
            <li
                class="list-group-item w-100 d-flex flex-column"
                *ngFor="let player of players(); trackBy: trackById; let i = index">
                <div class="d-flex flex-row col-sm-12 mb-2">
                    <div class="col-sm-8 d-flex align-items-center">
                        <label class="col-form-label w-100 text-ellipsis">{{player.name}}</label>
                    </div>
                    <div class="col-sm-3 d-flex align-items-center">
                        <ng-container *ngIf="currentPlayer(); let _currentPlayer">
                            <button
                                class="btn btn-sm btn-secondary w-100"
                                *ngIf="_currentPlayer.id === player.id"
                                (click)="leaveFromGame()">
                                Покинуть игру
                            </button>
                            <!-- TODO: Пока что это не нужно и работает не правильно -->
                            <!-- <button
                                class="btn btn-sm btn-secondary w-100"
                                *ngIf="_currentPlayer.id !== player.id"
                                (click)="kickUser(player.id)">
                                Выкинуть игрока
                            </button> -->
                        </ng-container>
                    </div>
                    <div class="col-sm-1 d-flex align-items-center justify-content-center">
                        <mat-icon
                            class="flex-shrink-0"
                            [color]="player.icon.color">{{player.icon.name}}
                        </mat-icon>
                    </div>
                </div>
                <div class="d-flex flex-row col-sm-12">
                    <div class="col-sm-2 d-flex align-items-center">
                        <label for="playerColorId" class="col-form-label">Цвет:</label>
                    </div>
                    <div class="col-sm-9 d-flex align-items-center">
                        <select class="form-select form-select-sm"
                            aria-label="Choose player color"
                            id="playerColorId"
                            [ngModel]="player.color.id"
                            (ngModelChange)="changeColor($event)"
                            [disabled]="currentPlayer()?.id != player.id">
                            <option
                                *ngFor="let colorId of colorIds"
                                [value]="colorId">
                                {{colorTaxanomy[colorId].name}} ({{colorTaxanomy[colorId].colorName}})
                            </option>
                        </select>
                    </div>
                    <div class="col-sm-1 d-flex align-items-center justify-content-center">
                        <div [style]="player.color.heroStyle"></div>
                    </div>
                </div>
            </li>
        </ul>
        <div
            class="card-body"
            *ngIf="currentPlayer() == null">
            <button
                class="btn btn-sm btn-primary col-sm-12"
                (click)="joinToGame()">
                Присоединиться
            </button>
        </div>
    </div>

</div>
