<div class="zoom-wrapper">
    <div class="layer">
        <app-rh-cell
            class="layer-cells"
            *ngFor="let cell of cells(); trackBy: trackById"
            [cell]="cell"
            [usedCellIds]="usedCellIds()"
            [activeCoords]="activeCoords()"
            [selectedPlayerId]="client.game.selectedPlayerId()"
            (onClick)="clickOnCell(cell)"
        ></app-rh-cell>
            <!-- (click)="isActivePlayer() ? cell.placeMeeple() : null" -->
        <app-rh-hero
            class="layer-meeples"
            *ngFor="let player of players(); trackBy: trackById"
            [data]="player"
        ></app-rh-hero>
            <!-- (click)="isActivePlayer() ? meeple.takeMeeple() : null" -->
    </div>
</div>
