<ng-container *ngIf="!isWatcher()">
    <button
        class="btn btn-danger"
        title="Закончить игру"
        #finishGamePopover="ngbPopover"
        [ngbPopover]="finishGamePopoverContent"
        [popoverTitle]="finishGamePopoverTitle"
        container="body"
        placement="start"
        popoverClass="game-popover">
        <fa-icon class="m-1" [icon]="icons.exit"></fa-icon>
    </button>
    <ng-template #finishGamePopoverTitle>
        Закончить игру?
    </ng-template>
    <ng-template #finishGamePopoverContent>
        <div class="d-flex flex-column">
            <div
                class="btn-group"
                role="group"
                aria-label="Popover actions">
                <button
                    type="button"
                    class="btn btn-sm btn-primary"
                    (click)="finishGame()">
                    Да
                </button>
                <button
                    type="button"
                    class="btn btn-sm btn-danger"
                    (click)="finishGamePopover.close()">
                    Нет
                </button>
            </div>
        </div>
    </ng-template>
</ng-container>

<button
    class="btn btn-dark"
    title="Настройки звука"
    (click)="dialogService.openSoundSettings()">
    <fa-icon class="m-1" [icon]="icons.settings"></fa-icon>
</button>

<button
    class="btn btn-dark"
    title="Награды на биомах"
    #helpTilePopover="ngbPopover"
    [ngbPopover]="helpTilePopoverContent"
    [popoverTitle]="helpTilePopoverTitle"
    [autoClose]="'outside'"
    container="body"
    placement="start"
    popoverClass="game-popover">
    <fa-icon class="m-1" [icon]="icons.help"></fa-icon>
</button>
<ng-template #helpTilePopoverTitle>
    Награды на биомах
</ng-template>
<ng-template #helpTilePopoverContent>
    <div class="d-flex flex-column">
        <div
            class="d-flex flex-row justify-content-start align-items-center m-1"
            *ngFor="let tile of RelicHuntersTileTypeTaxonomy">
            <app-rh-tile
                [tileType]="tile.type"
                [hasPlayer]="true"
                [width]="tile.width"
                [height]="tile.height"
            ></app-rh-tile>
            <div class="tile-arrow">→</div>
            <app-rh-benefit
                *ngFor="let benefit of tile.benefits"
                [data]="benefit"
            ></app-rh-benefit>
        </div>
        <button
            type="button"
            class="btn btn-sm btn-primary"
            (click)="helpTilePopover.close()">
            Закрыть
        </button>
    </div>
</ng-template>

<button
    class="btn btn-secondary"
    title="Уменьшение масштаба карты"
    [disabled]="disableZoomOut()"
    (click)="zoomOut()">
    <fa-icon class="m-1" [icon]="icons.zoomOut"></fa-icon>
</button>

<button
    class="btn btn-secondary"
    title="Увеличение масштаба карты"
    [disabled]="disableZoomIn()"
    (click)="zoomIn()">
    <fa-icon class="m-1" [icon]="icons.zoomIn"></fa-icon>
</button>
