<span
    class="rh_log_card_name"
    #helpTilePopover="ngbPopover"
    [ngbPopover]="popoverContent"
    triggers="mouseenter:mouseleave"
    placement="end"
    container="body">
    {{card().name}}
</span>
<ng-template #popoverContent>
    <app-rh-card
        [card]="card()"
        [isOpen]="true"
    ></app-rh-card>
</ng-template>
