<div
    *ngIf="data(); let dataInfo"
    class="benefit-wrap"
    placement="top"
    [ngbTooltip]="tooltipText()"
    [disableTooltip]="!!dataInfo.hideValue">
    <div
        class="benefit m-1"
        [style]="style()">
        <span *ngIf="dataInfo.inlineView && !dataInfo.hideValue">{{dataInfo.value}}</span>
    </div>
    <span
        *ngIf="!dataInfo.inlineView && !dataInfo.hideValue"
        class="m-1">
        {{dataInfo.value}}
    </span>
</div>
