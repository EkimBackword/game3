
<div mat-dialog-content>
    <div *ngIf="winner != null && colorInfo != null">
        <h4>Победитель:</h4>
        <div class="d-flex flex-row justify-content-start align-items-center flex-nowrap">
            <div
                class="m-1"
                [style]="heroStyle"
            ></div>
            <div
                class="m-1"
                [style.color]="colorInfo.color">
                <h2>{{winner.name}}</h2>
                <h3>{{colorInfo.name}}</h3>
            </div>
        </div>
        <h4>Реликвии:</h4>
        <div class="d-flex flex-row justify-content-start align-items-center flex-nowrap">
            <app-rh-relic
                *ngFor="let relicType of winner.artifacts"
                [relicType]="relicType"
                [size]="100"
            ></app-rh-relic>
        </div>
    </div>
</div>
<div mat-dialog-actions class="d-flex flex-row justify-content-end">
    <button
        class="btn btn-primary m-1"
        type="submit"
        (click)="finishGame()">
        Закончить игру
    </button>
</div>
