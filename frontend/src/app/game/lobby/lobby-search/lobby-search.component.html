<div class="container h-100 d-flex flex-column justify-content-center align-items-cente">
    <div class="card game_menu shadow">
        <div class="card-header">
            <h1>Список лобби</h1>
        </div>
        <div class="card-body">
            <mat-table [dataSource]="dataSource">
                <ng-container matColumnDef="name">
                    <mat-header-cell *matHeaderCellDef>Название</mat-header-cell>
                    <mat-cell *matCellDef="let element">
                        <a  class="game_menu_item"
                            [routerLink]="element.url"
                            routerLinkActive="active"
                            ariaCurrentWhenActive="page">
                            <fa-icon [icon]="linkIcon"></fa-icon>
                            <span class="game_menu_item_text">{{element.name}}</span>
                        </a>
                    </mat-cell>
                </ng-container>

                <ng-container matColumnDef="status">
                    <mat-header-cell *matHeaderCellDef> Статус игры </mat-header-cell>
                    <mat-cell *matCellDef="let element"> {{element.status}} </mat-cell>
                </ng-container>

                <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
                <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
            </mat-table>
        </div>
        <div class="card-footer">
            <a class="btn btn-link" routerLink="/">Вернуться в меню</a>
        </div>
    </div>

</div>
