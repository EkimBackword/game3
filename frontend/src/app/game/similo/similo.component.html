<div class="similo-card-wrapper">
    <div class="position-absolute similo_header"
        [style.width.px]="scene.headers.board.width"
        [style.top.px]="scene.headers.board.top"
        [style.left.px]="scene.headers.board.left">
        {{scene.headers.board.name}}
    </div>
    <div class="position-absolute similo_header similo_header__top_border"
        [style.width.px]="scene.headers.deck.width"
        [style.top.px]="scene.headers.deck.top"
        [style.left.px]="scene.headers.deck.left">
        {{scene.headers.deck.name}}
    </div>
    <div class="position-absolute similo_header similo_header__left_border"
        [style.width.px]="scene.headers.similar.width"
        [style.height.px]="scene.headers.similar.height"
        [style.paddingLeft.px]="scene.headers.similar.padding"
        [style.top.px]="scene.headers.similar.top"
        [style.left.px]="scene.headers.similar.left">
        {{scene.headers.similar.name}}
    </div>
    <div class="position-absolute similo_header similo_header__left_border"
        [style.width.px]="scene.headers.notSimilar.width"
        [style.height.px]="scene.headers.notSimilar.height"
        [style.paddingLeft.px]="scene.headers.notSimilar.padding"
        [style.top.px]="scene.headers.notSimilar.top"
        [style.left.px]="scene.headers.notSimilar.left">
        {{scene.headers.notSimilar.name}}
    </div>

    <app-similo-card
        class="position-absolute"
        *ngFor="let card of board; trackBy: trackById"
        [card]="card"
        [isMaster]="isMaster"
        [withHover]="true"
        [isBoard]="true"
        [ngStyle]="card.style"
        (openCard)="openCard(card, true)"
    ></app-similo-card>
    <app-similo-card
        class="position-absolute"
        *ngFor="let card of deck; trackBy: trackById"
        [card]="card"
        [isMaster]="isMaster"
        [withHover]="card.state.position != SimiloCardPosition.Deck"
        [ngStyle]="card.style"
        (openCard)="openCard(card, false)"
    ></app-similo-card>
</div>

<app-similo-table-info
    class="similo-table-info shadow-lg"
    (updateSocketState)="updateSocketState($event)"
    (kickUser)="kickUser($event)"
></app-similo-table-info>
