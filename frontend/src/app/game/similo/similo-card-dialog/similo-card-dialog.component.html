<h1 class="title" mat-dialog-title>
    {{data.card.state.name}}
</h1>
<div mat-dialog-content>
    <p>{{data.card.state.description}}</p>
    <app-similo-card
        [card]="data.card"
        [isMaster]="data.isMaster"
        [width]="SimiloCardWrapInfo.cardWidth"
        [height]="SimiloCardWrapInfo.cardHeight"
    ></app-similo-card>
</div>
<div mat-dialog-actions class="d-flex flex-row justify-content-end">
    <button class="btn btn-primary m-1"
        type="submit"
        *ngFor="let action of data.actions"
        (click)="dialogRef.close(action.value)">
        {{action.text}}
    </button>
    <button class="btn btn-primary m-1"
        type="submit"
        (click)="dialogRef.close()">
        {{data.cancelText ?? 'Закрыть'}}
    </button>
</div>
