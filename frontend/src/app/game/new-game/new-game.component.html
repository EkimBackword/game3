<form class="container h-100 d-flex flex-column justify-content-center align-items-center"
    [formGroup]="form"
>
    <div class="card w-50">
        <div class="card-header">
            <h1>Новая игра</h1>
        </div>
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label" for="game-name">
                    Название игры
                </label>
                <input class="form-control"
                    aria-describedby="game-name"
                    type="text"
                    id="game-name"
                    formControlName="name">
            </div>
            <div class="mb-3">
                <label class="form-label" for="mapId">Выберите поле:</label>
                <select class="form-select"
                    aria-label="Choose map id"
                    id="mapId"
                    formControlName="mapId">
                    <option *ngFor="let map of maps" [value]="map.id">{{map.name}}</option>
                </select>
            </div>
        </div>
        <div class="card-footer d-flex flex-row justify-content-end align-items-center">
            <button class="w-50 m-1 btn btn-primary"
                type="submit"
                (click)="submit()">
                Создать
            </button>
            <button class="w-50 m-1 btn btn-danger"
                type="button"
                (click)="cancel()">
                Отмена
            </button>
        </div>
    </div>
</form>
